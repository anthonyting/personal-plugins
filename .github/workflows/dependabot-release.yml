name: Dependabot security release

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: dependabot-security-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Determine release version
        id: version
        run: |
          base_version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version.txt must contain a major.minor.patch SemVer version." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          echo "version=${major}.${minor}.$((patch + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Run tests and build versioned shaded JAR
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew --no-daemon -PpluginVersion="$RELEASE_VERSION" test shadowJar

      - name: Prepare release files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-assets
          cp "build/libs/PersonalPlugins-${RELEASE_VERSION}-all.jar" release-assets/PersonalPlugins.jar
          sha256sum release-assets/PersonalPlugins.jar | cut -d ' ' -f 1 > release-assets/PersonalPlugins.jar.sha256

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personalplugins-release
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personalplugins-release
          path: release-assets

      - name: Check whether release already exists
        id: existing-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/PersonalPlugins.jar \
            release-assets/PersonalPlugins.jar.sha256 \
            --target "$MERGE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
