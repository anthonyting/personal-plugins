name: Build JAR

on:
  workflow_dispatch:

concurrency:
  group: personal-plugins-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Determine release version
        id: version
        run: bash .github/scripts/next-plugin-version.sh

      - name: Run tests and build shaded JAR
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew --no-daemon -PpluginVersion="$RELEASE_VERSION" test shadowJar

      - name: Prepare release files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-assets
          cp "build/libs/PersonalPlugins-${RELEASE_VERSION}-all.jar" release-assets/PersonalPlugins.jar
          sha256sum release-assets/PersonalPlugins.jar | cut -d ' ' -f 1 > release-assets/PersonalPlugins.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/PersonalPlugins.jar \
            release-assets/PersonalPlugins.jar.sha256 \
            LICENSE \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
